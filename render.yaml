# Render Blueprint: Docker web service with a persistent disk for SQLite.
services:
  - type: web
    name: llm-chatbot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter          # persistent disks require a paid instance
    healthCheckPath: /health
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false        # set in the Render dashboard, never committed
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: CACHE_ENABLED
        value: "true"
      - key: ENABLE_FAILURE_SIMULATION
        value: "false"
      - key: CORS_ORIGINS
        sync: false        # e.g. https://your-app.vercel.app
